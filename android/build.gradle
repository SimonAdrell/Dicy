buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    // Lock the Gradle plugin classpath (buildscript-gradle.lockfile).
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Dependency locking (gradle.lockfile) for this project and :app only.
// Autolinked libraries live in node_modules, so they are not locked here.
// Regenerate after changing Android/RN dependencies:
//   ./gradlew dependencies :app:dependencies buildEnvironment --write-locks
dependencyLocking {
    lockAllConfigurations()
}
