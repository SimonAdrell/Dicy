# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    ignore:
      # Babel 8 needs @babel/core 8, but @react-native/babel-preset (0.88.1,
      # 0.89 RC) still depends on @babel/core ^7. See closed #153 / #156.
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      # @react-native/eslint-config (0.88.1, 0.89 RC) only supports
      # eslint ^8 || ^9. See closed #154.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # The CLI is versioned with React Native (RN 0.88 template: CLI 20.2.0,
      # RN 0.89: CLI 21), and cli, cli-platform-android and cli-platform-ios
      # must match each other. See closed #162.
      - dependency-name: "@react-native-community/cli*"
        update-types: ["version-update:semver-major"]

  # Ruby gems for CocoaPods (iOS builds). Gradle is not listed: every Android
  # dependency is unversioned and pinned by the React Native Gradle plugin.
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"

  # GitHub Actions used by .github/workflows (pinned to commit SHAs).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
