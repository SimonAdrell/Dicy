name: Android CI

on:
  workflow_dispatch:
  # Add the `smoke-test` label to a PR to fire a one-shot smoke run
  # against the PR's head ref. The label can be removed and re-added
  # to retrigger.
  pull_request:
    types: [labeled]

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.label.name == 'smoke-test')
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      # --ignore-scripts skips the postinstall hook, so apply patches/
      # explicitly (react-native-modal needs its RN 0.88 fix in the APK).
      # Runs the lockfile-pinned patch-package via the npm script, never
      # an unpinned npx download.
      - name: Apply patch-package patches
        run: npm run postinstall

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The action's default ('tools platform-tools') fails: the legacy
          # 'tools' package no longer exists in the SDK repository.
          packages: 'platform-tools'

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: dicy-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

  smoke-test:
    name: Boot emulator + launch app
    runs-on: ubuntu-22.04
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.label.name == 'smoke-test')
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Diagnostic - host capabilities
        run: |
          echo "Runner OS:"
          cat /etc/os-release || true
          echo "---"
          echo "KVM device:"
          ls -la /dev/kvm || echo "no /dev/kvm"
          echo "---"
          echo "CPU virt flags:"
          egrep -c '(vmx|svm)' /proc/cpuinfo || echo "no vmx/svm in cpuinfo"
          echo "---"
          echo "Disk free:"
          df -h /
          echo "---"
          echo "Memory:"
          free -h

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download release APK
        uses: actions/download-artifact@v8
        with:
          name: dicy-release-apk
          path: ./apk

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          target: default
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh

      - name: Upload smoke-test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-output
          path: |
            screen.png
            logcat.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Write smoke verdict to job summary
        if: always()
        run: |
          set +e
          {
            echo "## Android smoke-test"
            echo ""
            echo "Commit: \`${{ github.sha }}\`  "
            echo "Job status: \`${{ job.status }}\`  "
            echo ""
            if [ -f logcat.txt ]; then
              ACT="missing"; JS="missing"; FATAL_DICY="none"
              grep -q "Displayed com.dicy/.MainActivity" logcat.txt && ACT="ok"
              grep -qE 'ReactNativeJS.*Running "dicy"' logcat.txt && JS="ok"
              if grep -E "FATAL EXCEPTION" logcat.txt | grep -q "com.dicy"; then
                FATAL_DICY=$(grep -A1 -E "FATAL EXCEPTION" logcat.txt | grep "com.dicy" | head -1)
              fi
              if [ "$ACT" = "ok" ] && [ "$JS" = "ok" ] && [ "$FATAL_DICY" = "none" ]; then
                echo "### Verdict: PASS"
              else
                echo "### Verdict: FAIL"
              fi
              echo ""
              echo "| Check | Result |"
              echo "| --- | --- |"
              echo "| MainActivity Displayed | \`$ACT\` |"
              echo "| ReactNativeJS Running \"dicy\" | \`$JS\` |"
              echo "| com.dicy FATAL EXCEPTION | \`$FATAL_DICY\` |"
              echo ""
              echo "_Note: job-status \`failure\` with verdict PASS usually means the emulator-runner action lost ADB after launch — the app itself booted. See CLAUDE.md._"
            else
              echo "### Verdict: NO LOGCAT (smoke step never produced logcat.txt)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment smoke verdict on PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          REPO="${{ github.repository }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          ACT="missing"; JS="missing"; FATAL_DICY="none"
          if [ -f logcat.txt ]; then
            grep -q "Displayed com.dicy/.MainActivity" logcat.txt && ACT="ok"
            grep -qE 'ReactNativeJS.*Running "dicy"' logcat.txt && JS="ok"
            if grep -E "FATAL EXCEPTION" logcat.txt | grep -q "com.dicy"; then
              FATAL_DICY=$(grep -A1 -E "FATAL EXCEPTION" logcat.txt | grep "com.dicy" | head -1)
            fi
          else
            ACT="no-logcat"; JS="no-logcat"
          fi
          if [ "$ACT" = "ok" ] && [ "$JS" = "ok" ] && [ "$FATAL_DICY" = "none" ]; then
            VERDICT="PASS"
          else
            VERDICT="FAIL"
          fi
          BODY=$(printf "**Android smoke-test %s** for \`%s\`\n\nJob status: \`%s\`\nRun: %s\n\n- MainActivity Displayed: \`%s\`\n- ReactNativeJS Running \"dicy\": \`%s\`\n- com.dicy FATAL EXCEPTION: \`%s\`\n" \
            "$VERDICT" "$SHA_SHORT" "${{ job.status }}" "$RUN_URL" "$ACT" "$JS" "$FATAL_DICY")
          PAYLOAD=$(BODY="$BODY" python3 -c "import json,os;print(json.dumps({'body': os.environ['BODY']}))")
          curl --proto '=https' -sSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
            -d "$PAYLOAD" | head -c 200; echo

      - name: Publish smoke-test output to release (for unauth access)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURL_PROTO: "=https"
        run: |
          # Best-effort: don't let release-API flakes mask the verdict.
          set +e
          TAG="ci-smoke-latest"
          REPO="${{ github.repository }}"
          curl --proto "$CURL_PROTO" -fsSL -X GET -H "Authorization: Bearer $GH_TOKEN" \
            -o /tmp/rel.json \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG"
          REL_ID=$(python3 -c "import json;d=json.load(open('/tmp/rel.json'));print(d.get('id',''))" 2>/dev/null)
          if [ -n "$REL_ID" ]; then
            curl --proto "$CURL_PROTO" -fsSL -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/$REL_ID"
          fi
          curl --proto "$CURL_PROTO" -fsSL -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/git/refs/tags/$TAG"
          REL=$(curl --proto "$CURL_PROTO" -sSL -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases" \
            -d "{\"tag_name\":\"$TAG\",\"target_commitish\":\"${{ github.sha }}\",\"name\":\"CI smoke-test latest (${{ github.sha }})\",\"body\":\"Auto-published smoke-test output for run ${{ github.run_id }}\",\"draft\":false,\"prerelease\":true}")
          UPLOAD_URL=$(echo "$REL" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('upload_url','').split('{')[0])" 2>/dev/null)
          if [ -n "$UPLOAD_URL" ]; then
            for f in logcat.txt screen.png; do
              if [ -f "$f" ]; then
                CT=$([ "$f" = "screen.png" ] && echo "image/png" || echo "text/plain")
                curl --proto "$CURL_PROTO" -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Content-Type: $CT" \
                  --data-binary "@$f" \
                  "$UPLOAD_URL?name=$f" >/dev/null && echo "uploaded $f"
              fi
            done
          else
            echo "::warning::Release create returned no upload_url; verdict is still in step summary + PR comment"
          fi
          exit 0
